[package]
name = "nd"
version = "0.1.0"
description = "An example generated using the hello-world template"
authors = ["ForbiddenR"]
license = "MIT"
edition = "2024"

[workspace]
members = ["app", "ratatui-json-editor"]

# [[bin]]
# name = "json-editor"
# path = "ratatui-json-editor/src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0", features = ["rustls", "blocking", "json"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
