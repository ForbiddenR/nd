[package]
name = "nd"
version = "0.8.0"
description = "A terminal UI for managing nerdctl containers, images, and builds"
authors = ["ForbiddenR"]
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0", features = ["rustls", "blocking", "json"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
