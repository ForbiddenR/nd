# This machine has no system cc/ar/ld — only a zig toolchain. Route the C
# compiler, archiver, and Rust linker through zig wrappers so native deps
# (aws-lc-sys, etc.) build without a system GCC/binutils.
#
# Wrappers live in /home/.local/bin:
#   zigcc  -> `zig cc`, translating the Rust triple x86_64-unknown-linux-gnu
#             to zig's x86_64-linux-gnu
#   ar     -> `zig ar`
[env]
CC = "/home/.local/bin/zigcc"
CXX = "zig c++"
AR = "/home/.local/bin/ar"

[target.x86_64-unknown-linux-gnu]
linker = "/home/.local/bin/zigcc"
